<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pre-Shoot Questionnaire | Poux Productions</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">

    <a href="index.html" class="wordmark">
        POUX PRODUCTIONS
        <span>PORTRAIT PHOTOGRAPHER</span>
    </a>

</header>


<main class="questionnaire-container">

    <div class="questionnaire-heading">

        <p class="eyebrow">POUX PRODUCTIONS</p>

        <h1>PRE-SHOOT<br>QUESTIONNAIRE</h1>

        <p>
            Let's get to know you and your vision.
            Please complete this questionnaire before your session
            so we can create something unforgettable.
        </p>

    </div>


    <form id="shootForm">

        <!-- FIRST NAME -->

        <div class="form-group">

            <label for="firstName">First Name *</label>

            <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Your first name"
                required
            >

        </div>


        <!-- LAST NAME -->

        <div class="form-group">

            <label for="lastName">Last Name *</label>

            <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Your last name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">Email *</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

        </div>


        <!-- TYPE OF SHOOT -->

        <div class="form-group">

            <label for="shootType">
                Type of Shoot <span>* REQUIRED</span>
            </label>

            <select id="shootType" name="shootType" required>

                <option value="">Select your shoot type</option>

                <option>Portrait Photography</option>

                <option>Birthday Photoshoot</option>

                <option>Graduation Photoshoot</option>

                <option>Fashion / Editorial</option>

                <option>Personal Branding</option>

                <option>Couples Photoshoot</option>

                <option>Maternity</option>

                <option>Creative Concept Shoot</option>

                <option>Other</option>

            </select>

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label for="phone">Phone</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Your phone number"
            >

        </div>


        <!-- MAKEUP -->

        <div class="form-group">

            <label for="makeup">Makeup?</label>

            <select id="makeup" name="makeup">

                <option value="">Select an option</option>

                <option>Yes, I will have a makeup artist.</option>

                <option>No, I will be doing my own makeup.</option>

                <option>I would like makeup recommendations.</option>

                <option>I am interested in booking a makeup artist.</option>

            </select>

        </div>


        <!-- LOCATION -->

        <div class="form-group">

            <label for="location">
                Preferred Shoot Location <span>* REQUIRED</span>
            </label>

            <select id="location" name="location" required>

                <option value="">Choose your preferred location</option>

                <option>Studio</option>

                <option>Outdoor Location</option>

                <option>Hotel / Airbnb</option>

                <option>Home / Personal Space</option>

                <option>Peerspace Rental</option>

                <option>I'm open to suggestions</option>

            </select>

        </div>


        <!-- WHO IS IN THE SESSION -->

        <div class="form-group">

            <label for="session">
                Who is in this session?
            </label>

            <textarea
                id="session"
                name="session"
                placeholder="Tell me who will be participating in the shoot..."
            ></textarea>

        </div>


        <!-- POSSIBLE DATES -->

        <div class="form-group">

            <label for="dates">
                Possible Dates That Can Work
            </label>

            <textarea
                id="dates"
                name="dates"
                placeholder="List a few dates and times that work for you..."
            ></textarea>

        </div>


        <!-- NOTES -->

        <div class="form-group">

            <label for="notes">
                Any Notes About the Shoot?
            </label>

            <p class="field-description">
                Props, poses, Pinterest board... Feel free to share your ideas!
            </p>

            <textarea
                id="notes"
                name="notes"
                placeholder="Tell me about your vision, inspiration, props, poses, outfits, or Pinterest boards..."
            ></textarea>

        </div>


        <!-- VIBE -->

        <div class="form-group">

            <label for="vibe">
                Vibe / Atmosphere <
